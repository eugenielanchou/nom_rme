<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #xy-area {
      position: relative; width: 400px; height: 400px;
      border: 2px solid #333; background: #f5f5f5;
      touch-action: none; cursor: crosshair; box-sizing: border-box;
    }
    #xy-point {
      position: absolute; width: 20px; height: 20px;
      border-radius: 50%; background: #222;
      transform: translate(-50%, -50%);
      left: 50%; top: 50%; cursor: grab;
    }
  </style>
</head>
<body>

<div style="display: flex; align-items: flex-start; gap: 0;">

  <div style="display: flex; flex-direction: row; align-items: stretch; margin-right: 10px; height: 400px;">
    <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; height: 400px; margin-right: 8px; font-size: 13px; color: #555; white-space: nowrap;">
      <span>Very useful (100)</span>
      <span>Somewhat useful (50)</span>
      <span>Not useful (0)</span>
    </div>
    <div style="writing-mode: vertical-rl; transform: rotate(180deg); font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; height: 400px; margin-right: 10px;">
      NOM
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center;">
    <div id="xy-area">
      <div style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#bbb;"></div>
      <div style="position:absolute;top:50%;left:0;width:100%;height:1px;background:#bbb;"></div>
      <div style="position:absolute;left:0;bottom:0;width:566px;height:1px;background:#999;transform:rotate(-45deg);transform-origin:left center;opacity:0.6;"></div>
      <div id="xy-point"></div>
    </div>

    <div style="display:flex;justify-content:space-between;width:400px;margin-top:10px;font-size:13px;color:#555;">
      <span>Not useful (0)</span>
      <span>Somewhat useful (50)</span>
      <span>Very useful (100)</span>
    </div>

    <div style="font-size:17px;font-weight:500;margin-top:10px;">RME</div>

    <div style="margin-top:16px;font-size:15px;color:#555;">
      X: <strong id="x-display">50</strong>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      Y: <strong id="y-display">50</strong>
    </div>

    <div style="margin-top:16px;display:flex;gap:10px;">
      <button id="validate-xy" style="padding:8px 20px;font-size:15px;cursor:pointer;">Validate</button>
      <button id="reset-xy" style="padding:8px 20px;font-size:15px;cursor:pointer;">Try again</button>
    </div>

    <div id="xy-status" style="margin-top:12px;font-size:15px;font-weight:500;color:green;display:none;">
      ✓ Response validated — you can continue.
    </div>
  </div>
</div>

<script>
(function () {
  var area = document.getElementById("xy-area");
  var point = document.getElementById("xy-point");
  var xDisplay = document.getElementById("x-display");
  var yDisplay = document.getElementById("y-display");
  var validateBtn = document.getElementById("validate-xy");
  var resetBtn = document.getElementById("reset-xy");
  var status = document.getElementById("xy-status");

  var isDragging = false, isValidated = false;
  var currentX = 50, currentY = 50;

  function setPoint(x, y) {
    currentX = x; currentY = y;
    point.style.left = x + "%";
    point.style.top = (100 - y) + "%";
    xDisplay.textContent = x;
    yDisplay.textContent = y;
  }

  function updatePoint(clientX, clientY) {
    if (isValidated) return;
    var rect = area.getBoundingClientRect();
    var x = Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * 100);
    var y = Math.round(Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height)) * 100);
    setPoint(x, y);
  }

  area.addEventListener("mousedown", function(e) { if (!isValidated) { isDragging = true; updatePoint(e.clientX, e.clientY); } });
  document.addEventListener("mousemove", function(e) { if (isDragging) updatePoint(e.clientX, e.clientY); });
  document.addEventListener("mouseup", function() { isDragging = false; });
  area.addEventListener("touchstart", function(e) { if (!isValidated) { isDragging = true; updatePoint(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
  area.addEventListener("touchmove", function(e) { if (isDragging) { updatePoint(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
  area.addEventListener("touchend", function() { isDragging = false; });

  validateBtn.addEventListener("click", function() {
    isValidated = true;
    point.style.background = "#1a9e5c";
    point.style.cursor = "default";
    status.style.display = "block";

    // Envoie X et Y à LimeSurvey via postMessage
    window.parent.postMessage({
      type: "xyData",
      payload: { x: currentX, y: currentY }
    }, "*");
  });

  resetBtn.addEventListener("click", function() {
    isValidated = false;
    status.style.display = "none";
    point.style.background = "#222";
    point.style.cursor = "grab";
    setPoint(50, 50);

    // Réinitialise côté parent
    window.parent.postMessage({ type: "xyReset" }, "*");
  });

  setPoint(50, 50);
})();
</script>
</body>
</html>
