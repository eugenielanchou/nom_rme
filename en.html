<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: white;
      font-size: 16px;
    }

    #xy-area {
      position: relative;
      width: 400px;
      height: 400px;
      border: 2px solid #333;
      background: #f5f5f5;
      touch-action: none;
      cursor: crosshair;
      box-sizing: border-box;
      overflow: hidden;
    }

    .grid-line {
      position: absolute;
      background: rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }

    .grid-line.vertical {
      top: 0;
      width: 1px;
      height: 100%;
    }

    .grid-line.horizontal {
      left: 0;
      width: 100%;
      height: 1px;
    }

    #xy-point {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #222;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      cursor: grab;
      z-index: 5;
    }

    .main-axis {
      position: absolute;
      background: #aaa;
      z-index: 2;
      pointer-events: none;
    }

    .diag-line {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 566px;
      height: 1px;
      background: #999;
      transform: rotate(-45deg);
      transform-origin: left center;
      opacity: 0.6;
      z-index: 2;
      pointer-events: none;
    }

    button {
      padding: 10px 22px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #333;
      background: #f2f2f2;
      color: #222;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    #validate-xy:hover,
    #reset-xy:hover {
      background: #e6e6e6;
    }
  </style>
</head>
<body>

<div style="display:flex; align-items:flex-start; gap:0;">

  <!-- Y labels + NOM -->
  <div style="display:flex; flex-direction:row; align-items:stretch; margin-right:10px; height:400px;">
    <div style="display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; height:400px; margin-right:8px; font-size:15px; font-weight:600; color:#555; white-space:nowrap;">
      <span>Very useful (100)</span>
      <span>Somewhat useful (50)</span>
      <span>Not useful (0)</span>
    </div>
    <div style="writing-mode:vertical-rl; transform:rotate(180deg); font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; height:400px; margin-right:10px;">
      NOM
    </div>
  </div>

  <!-- Grid + X labels -->
  <div style="display:flex; flex-direction:column; align-items:center;">
    <div id="xy-area">
      <!-- Grille fine tous les 10 -->
      <div class="grid-line vertical" style="left:10%;"></div>
      <div class="grid-line vertical" style="left:20%;"></div>
      <div class="grid-line vertical" style="left:30%;"></div>
      <div class="grid-line vertical" style="left:40%;"></div>
      <div class="grid-line vertical" style="left:50%;"></div>
      <div class="grid-line vertical" style="left:60%;"></div>
      <div class="grid-line vertical" style="left:70%;"></div>
      <div class="grid-line vertical" style="left:80%;"></div>
      <div class="grid-line vertical" style="left:90%;"></div>

      <div class="grid-line horizontal" style="top:10%;"></div>
      <div class="grid-line horizontal" style="top:20%;"></div>
      <div class="grid-line horizontal" style="top:30%;"></div>
      <div class="grid-line horizontal" style="top:40%;"></div>
      <div class="grid-line horizontal" style="top:50%;"></div>
      <div class="grid-line horizontal" style="top:60%;"></div>
      <div class="grid-line horizontal" style="top:70%;"></div>
      <div class="grid-line horizontal" style="top:80%;"></div>
      <div class="grid-line horizontal" style="top:90%;"></div>

      <!-- Axes principaux -->
      <div class="main-axis" style="left:50%; top:0; width:1px; height:100%;"></div>
      <div class="main-axis" style="top:50%; left:0; width:100%; height:1px;"></div>

      <!-- Diagonale -->
      <div class="diag-line"></div>

      <!-- Point -->
      <div id="xy-point"></div>
    </div>

    <div style="display:flex;justify-content:space-between;width:400px;margin-top:14px;font-size:15px;font-weight:600;color:#555;">
      <span>Not useful (0)</span>
      <span>Somewhat useful (50)</span>
      <span>Very useful (100)</span>
    </div>

    <div style="font-size:20px;font-weight:700;margin-top:12px;">RME</div>

    <!-- Descendu un peu -->
    <div style="margin-top:30px;font-size:17px;color:#555;">
      RME : <strong id="x-display">50</strong>
      &nbsp;&nbsp;|&nbsp;&nbsp;
      NOM : <strong id="y-display">50</strong>
    </div>

    <!-- Descendu un peu aussi -->
    <div style="margin-top:24px;display:flex;gap:10px;">
      <button id="validate-xy">Validate</button>
      <button id="reset-xy">Try again</button>
    </div>

    <div id="xy-status" style="margin-top:14px;font-size:17px;font-weight:600;color:green;display:none;">
      ✓ Response validated — you can continue.
    </div>
  </div>
</div>

<script>
(function () {
  var area = document.getElementById("xy-area");
  var point = document.getElementById("xy-point");
  var xDisplay = document.getElementById("x-display");
  var yDisplay = document.getElementById("y-display");
  var validateBtn = document.getElementById("validate-xy");
  var resetBtn = document.getElementById("reset-xy");
  var status = document.getElementById("xy-status");

  var isDragging = false, isValidated = false;
  var currentX = 50, currentY = 50;

  function setPoint(x, y) {
    currentX = x;
    currentY = y;
    point.style.left = x + "%";
    point.style.top = (100 - y) + "%";
    xDisplay.textContent = x;
    yDisplay.textContent = y;
  }

  function updatePoint(clientX, clientY) {
    if (isValidated) return;
    var rect = area.getBoundingClientRect();
    var x = Math.round(Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * 100);
    var y = Math.round(Math.max(0, Math.min(1, 1 - (clientY - rect.top) / rect.height)) * 100);
    setPoint(x, y);
  }

  area.addEventListener("mousedown", function(e) {
    if (!isValidated) {
      isDragging = true;
      updatePoint(e.clientX, e.clientY);
    }
  });

  document.addEventListener("mousemove", function(e) {
    if (isDragging) updatePoint(e.clientX, e.clientY);
  });

  document.addEventListener("mouseup", function() {
    isDragging = false;
  });

  area.addEventListener("touchstart", function(e) {
    if (!isValidated) {
      isDragging = true;
      updatePoint(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  area.addEventListener("touchmove", function(e) {
    if (isDragging) {
      updatePoint(e.touches[0].clientX, e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  area.addEventListener("touchend", function() {
    isDragging = false;
  });

  validateBtn.addEventListener("click", function() {
    isValidated = true;
    point.style.background = "#1a9e5c";
    point.style.cursor = "default";
    status.style.display = "block";

    validateBtn.style.background = "#1a9e5c";
    validateBtn.style.color = "white";
    validateBtn.style.borderColor = "#1a9e5c";

    resetBtn.style.background = "#d9d9d9";
    resetBtn.style.color = "#666";
    resetBtn.style.borderColor = "#bdbdbd";

    window.parent.postMessage({
      type: "xyData",
      payload: { x: currentX, y: currentY }
    }, "*");
  });

  resetBtn.addEventListener("click", function() {
    isValidated = false;
    status.style.display = "none";
    point.style.background = "#222";
    point.style.cursor = "grab";
    setPoint(50, 50);

    validateBtn.style.background = "#f2f2f2";
    validateBtn.style.color = "#222";
    validateBtn.style.borderColor = "#333";

    resetBtn.style.background = "#f2f2f2";
    resetBtn.style.color = "#222";
    resetBtn.style.borderColor = "#333";

    window.parent.postMessage({ type: "xyReset" }, "*");
  });

  setPoint(50, 50);
})();
</script>
</body>
</html>
